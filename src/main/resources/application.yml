server:
  port: 9102

spring:
  flyway:
    enabled: true
    # Pre-Flyway databases already have these tables (they were created by
    # ddl-auto). Baselining marks them at the baseline version and skips V1
    # instead of replaying it and failing on "relation already exists".
    baseline-on-migrate: true
  application:
    name: aegis-identity-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_identity}
    username: ${POSTGRES_USER:aegis}
    # M-core-6: no inline secret default — startup fails fast if POSTGRES_PASSWORD is unset outside the
    # dev profile (the dev profile supplies a dev-only fallback in application-dev.yml).
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # M-core-5: prod-safe default. This is a credential store — never let Hibernate mutate its schema
      # in prod. Production uses versioned migrations (Flyway) with validate; the dev profile overrides
      # this to `update` (application-dev.yml) and tests request `update` explicitly.
      ddl-auto: validate
    open-in-view: false
aegis:
  jwt:
    # Keys are fetched from a reachable in-network JWKS URI (see ResourceServerJwtConfig for why the
    # issuer-uri approach cannot be used across the Docker split-horizon). Issuers are validated against
    # an allowlist instead. In Docker, AEGIS_JWKS_URI points at http://authorization-server:9000/oauth2/jwks.
    jwk-set-uri: ${AEGIS_JWKS_URI:http://localhost:9000/oauth2/jwks}
    accepted-issuers: ${AEGIS_ACCEPTED_ISSUERS:http://localhost:9000,http://authorization-server:9000}
  identity:
    lockout:
      threshold: 5
      duration: PT15M
  cors:
    allowed-origins: ${AEGIS_CORS_ORIGINS:https://app.aegis.local}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
